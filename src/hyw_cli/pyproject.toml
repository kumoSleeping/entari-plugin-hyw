[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyw-cli"
version = "0.0.1"
description = "CLI tool for HYW Core - search, screenshot, render and query from command line"
authors = [{name = "kumoSleeping", email = "zjr2992@outlook.com"}]
dependencies = [
    "hyw-core",
    "click>=8.0.0",
    "rich>=13.0.0",
]
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
keywords = ["cli", "llm", "search", "screenshot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]

[project.scripts]
hyw = "hyw_cli:cli"

[project.urls]
Homepage = "https://github.com/kumoSleeping/hyw-cli"
Repository = "https://github.com/kumoSleeping/hyw-cli"

[tool.uv.sources]
hyw-core = { workspace = true }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["hyw_cli*"]
