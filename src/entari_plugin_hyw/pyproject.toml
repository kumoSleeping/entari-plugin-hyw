[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entari-plugin-hyw"
version = "4.0.10"
description = "Entari plugin for HYW - Use large language models to interpret chat messages"
authors = [{name = "kumoSleeping", email = "zjr2992@outlook.com"}]
dependencies = [
    "arclet-entari[full]>=0.16.5",
    "openai>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "DrissionPage>=4.0.0",
    "trafilatura>=1.6.0",
    "loguru>=0.7.0",
    "Pillow>=10.0.0",
    "markdown>=3.10",
    "satori-python-core<0.18.0",
    "satori-python-client<0.18.0",
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "MIT"}
keywords = ["entari", "llm", "ai", "bot", "chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "entari-plugin-server>=0.5.0",
    "satori-python-adapter-onebot11>=0.2.5",
    "noneprompt",
    "rich",
]

[project.urls]
Homepage = "https://github.com/kumoSleeping/entari-plugin-hyw"
Repository = "https://github.com/kumoSleeping/entari-plugin-hyw"
"Issue Tracker" = "https://github.com/kumoSleeping/entari-plugin-hyw/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"entari_plugin_hyw.core" = [
    "tools/_public/browser/landing.html",
    "tools/_public/browser/assets/**/*",
    "tools/_public/browser/card-ui/**/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["entari_plugin_hyw*"]
