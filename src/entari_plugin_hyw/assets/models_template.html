<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model List</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-[#f2f2f2] p-0 box-border m-0 font-sans text-gray-800">
    <div id="main-container" class="w-full max-w-[450px] flex flex-col gap-3 mx-auto bg-[#f2f2f2] p-0 font-sans h-fit">

        <!-- Header Card -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-200 mt-4 mx-4">
            <div class="flex items-center gap-3 mb-1">
                <div
                    class="w-10 h-10 rounded-full bg-gradient-to-br from-pink-300 to-pink-400 flex items-center justify-center text-white shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 8V4H8" />
                        <rect width="16" height="12" x="4" y="8" rx="2" />
                        <path d="M2 14h2" />
                        <path d="M20 14h2" />
                        <path d="M15 13v2" />
                        <path d="M9 13v2" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-800 leading-tight">Available Models</h1>
                    <p class="text-xs text-gray-500 font-medium">List of configured models</p>
                </div>
            </div>
        </div>

        <!-- Models List Container -->
        <div id="models-container" class="flex flex-col gap-3 px-4 pb-4">
            {{ models_list }}
        </div>

    </div>
</body>

</html>
