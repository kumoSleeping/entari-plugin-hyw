<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entari Render</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>
    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <!-- Marked (Removed, using server-side rendering) -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script> -->

    <style type="text/tailwindcss">
        /* Custom scrollbar for code blocks */
        pre::-webkit-scrollbar {
            height: 8px;
            background-color: transparent;
        }
        pre::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        
        /* Markdown Styles Override/Enhancement */
        .markdown-body h1 { @apply text-2xl font-bold mt-6 mb-4 text-gray-800 border-b border-gray-200 pb-2; }
        .markdown-body h2 { @apply text-xl font-bold mt-5 mb-3 text-gray-800; }
        .markdown-body h3 { @apply text-lg font-bold mt-4 mb-2 text-gray-800; }
        .markdown-body h4 { @apply text-base font-bold mt-3 mb-2 text-gray-800; }
        .markdown-body p { @apply mb-4 leading-7 text-gray-700; }
        .markdown-body ul { @apply list-disc pl-5 mb-4 space-y-1 text-gray-700; }
        .markdown-body ol { @apply list-decimal pl-5 mb-4 space-y-1 text-gray-700; }
        .markdown-body li { @apply pl-1; }
        .markdown-body li > p { @apply mb-1; }
        .markdown-body a { @apply text-pink-600 underline decoration-pink-300 underline-offset-2 hover:text-pink-700 hover:decoration-pink-700 transition-colors; }
        .markdown-body blockquote { @apply border-l-4 border-gray-300 pl-4 italic text-gray-600 my-4 bg-gray-50 py-2 pr-2 rounded-r; }
        /* Code Highlight Customization (Pink & Warm Theme) */
        .hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-name, .hljs-tag { color: #db2777 !important; } /* pink-600 */
        .hljs-string, .hljs-title, .hljs-section, .hljs-attribute, .hljs-literal, .hljs-template-tag, .hljs-template-variable, .hljs-type, .hljs-addition { color: #d97706 !important; } /* amber-600 */
        .hljs-comment, .hljs-quote, .hljs-deletion, .hljs-meta { color: #9ca3af !important; } /* gray-400 */
        .hljs-number, .hljs-symbol, .hljs-bullet { color: #ea580c !important; } /* orange-600 */
        .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-title, .hljs-section, .hljs-doctag, .hljs-type, .hljs-name, .hljs-strong { font-weight: bold; }

        .markdown-body code { @apply bg-white px-1.5 py-0.5 rounded text-sm font-mono text-pink-600 border border-gray-100; }
        .markdown-body pre { @apply bg-white p-4 rounded-lg overflow-x-auto mb-4 text-sm leading-normal border border-gray-100 shadow-sm; }
        .markdown-body pre code { @apply bg-transparent p-0 text-gray-800 border-none; }
        .markdown-body img { @apply max-w-[60%] h-auto rounded-lg my-4 shadow-sm border border-gray-100; }
        .markdown-body table { @apply w-full border-collapse mb-4 text-sm; }
        .markdown-body th { @apply border border-gray-300 px-4 py-2 bg-gray-50 font-semibold text-left text-gray-700; }
        .markdown-body td { @apply border border-gray-300 px-4 py-2 text-gray-700; }
        .markdown-body hr { @apply my-6 border-gray-200; }
        .markdown-body > *:last-child { @apply mb-0; }
        
        /* KaTeX adjustments */
        .katex-display { @apply overflow-x-auto overflow-y-hidden py-2; }
        
        /* Mermaid adjustments */
        .mermaid { @apply flex justify-center my-4 bg-gray-50 p-4 rounded-lg border border-gray-100; }

        /* Citation Styles */
        .citation-ref {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: super;
            font-size: 0.75em;
            font-weight: bold;
            color: #db2777;
            background-color: #fdf2f8;
            border: 1px solid #fce7f3;
            border-radius: 9999px;
            width: 1.4em;
            height: 1.4em;
            margin-left: 2px;
            cursor: pointer;
            text-decoration: none !important;
            transition: all 0.2s;
            position: relative;
            line-height: 1;
            box-shadow: none !important;
        }

        .citation-ref:hover {
            background-color: #db2777;
            color: white;
            text-decoration: none !important;
        }

        .citation-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 8px;
            background: white;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 8px;
            padding: 8px 12px;
            width: max-content;
            max-width: 300px;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
            pointer-events: none;
            font-size: 12px;
            line-height: 1.4;
            color: #374151;
            text-align: left;
            font-weight: normal;
        }

        .citation-ref:hover .citation-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-4px);
        }

        .citation-tooltip-title {
            font-weight: 600;
            color: #111827;
            margin-bottom: 2px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }

        .citation-tooltip-url {
            color: #6b7280;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>

<body class="bg-[#f2f2f2] p-0 box-border m-0 font-sans text-gray-800">
    <div id="main-container" class="w-full max-w-[450px] flex flex-col gap-3 mx-auto bg-[#f2f2f2] p-0 font-sans h-fit">
        <!-- Response Card -->
        <div class="bg-[#f2f2f2] rounded-2xl p-5 shadow-sm border-[1.5px] border-gray-300 overflow-hidden">
            {{ response_header }}
            <div id="markdown-content" class="markdown-body text-[15px] leading-relaxed text-gray-800">
                {{ content_html }}
            </div>
        </div>

        <!-- References Card (Optional) -->
        {{ references }}

        <!-- Speculation Card (Optional) -->
        {{ suggestions }}

        <!-- Stats Footer -->
        {{ stats }}
    </div>

    <script>window.REFERENCES = {{ references_json }};</script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Highlight Code Blocks
            hljs.highlightAll();

            // 2. Render Mermaid
            mermaid.initialize({
                startOnLoad: false,
                theme: 'default',
                securityLevel: 'loose',
            });

            // Find mermaid blocks (rendered as code blocks with language-mermaid class by python-markdown)
            // Python markdown 'fenced_code' extension renders: <pre><code class="language-mermaid">...</code></pre>
            // We need to transform this for mermaid.js
            const mermaidBlocks = document.querySelectorAll('code.language-mermaid');
            mermaidBlocks.forEach(block => {
                const pre = block.parentElement;
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.textContent;
                pre.replaceWith(div);
            });

            setTimeout(() => {
                mermaid.run({
                    nodes: document.querySelectorAll('.mermaid')
                });
            }, 0);

            // 3. Render Math (KaTeX)
            const contentDiv = document.getElementById('markdown-content');
            renderMathInElement(contentDiv, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false
            });

            // 4. Process Citations (Manual replacement since we don't have marked extension anymore)
            // We can do a simple regex replace on the HTML content for [1], [2] etc.
            // Be careful not to replace inside attributes.
            // A safer way is to walk text nodes.

            function processCitations(rootNode) {
                const walker = document.createTreeWalker(
                    rootNode,
                    NodeFilter.SHOW_TEXT,
                    null,
                    false
                );

                const nodesToReplace = [];
                let node;
                while (node = walker.nextNode()) {
                    if (node.parentElement.tagName === 'SCRIPT' || node.parentElement.tagName === 'STYLE' || node.parentElement.tagName === 'A') continue;
                    if (/\[\d+\]/.test(node.nodeValue)) {
                        nodesToReplace.push(node);
                    }
                }

                nodesToReplace.forEach(textNode => {
                    const fragment = document.createDocumentFragment();
                    let lastIndex = 0;
                    const text = textNode.nodeValue;
                    const regex = /\[(\d+)\]/g;
                    let match;

                    while ((match = regex.exec(text)) !== null) {
                        // Text before match
                        fragment.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));

                        const id = match[1];
                        const ref = window.REFERENCES ? window.REFERENCES.find(r => r.id == id) : null;

                        if (ref) {
                            const span = document.createElement('span');
                            const title = ref.title.replace(/"/g, '&quot;');
                            const url = ref.url;
                            let domain = 'unknown';
                            try { domain = new URL(url).hostname; } catch (e) { }
                            const favicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;

                            span.innerHTML = `<a href="${url}" target="_blank" class="citation-ref" data-id="${id}">
                                ${id}
                                <span class="citation-tooltip">
                                    <span class="citation-tooltip-title">${title}</span>
                                    <span class="citation-tooltip-url">
                                        <img src="${favicon}" style="width:12px;height:12px;vertical-align:middle;margin-right:4px;">
                                        ${domain}
                                    </span>
                                </span>
                            </a>`;
                            fragment.appendChild(span.firstElementChild);
                        } else {
                            fragment.appendChild(document.createTextNode(match[0]));
                        }

                        lastIndex = regex.lastIndex;
                    }

                    // Remaining text
                    fragment.appendChild(document.createTextNode(text.substring(lastIndex)));
                    textNode.parentNode.replaceChild(fragment, textNode);
                });
            }

            processCitations(contentDiv);
        });
    </script>
</body>

</html>
