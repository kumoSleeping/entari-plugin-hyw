[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entari-plugin-codex"
version = "0.0.1"
description = "Entari plugin for Codex execution and progress streaming"
authors = [{name = "kumoSleeping", email = "zjr2992@outlook.com"}]
dependencies = [
    "arclet-entari[full]>=0.16.5",
    "entari-plugin-hyw>=4.0.5",
    "DrissionPage>=4.0.0",
    "loguru>=0.7.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "cairosvg>=2.7.1",
    "satori-python-core<0.18.0",
    "satori-python-client<0.18.0",
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "MIT"}
keywords = ["entari", "llm", "ai", "bot", "chat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "entari-plugin-server>=0.5.0",
    "satori-python-adapter-onebot11>=0.2.5",
    "noneprompt",
    "rich",
]

[project.urls]
Homepage = "https://github.com/kumoSleeping/entari-plugin-codex"
Repository = "https://github.com/kumoSleeping/entari-plugin-codex"
"Issue Tracker" = "https://github.com/kumoSleeping/entari-plugin-codex/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["entari_plugin_codex*"]
