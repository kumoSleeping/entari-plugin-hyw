[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyw-workspace"
version = "0.0.0"
description = "HYW Workspace - Development environment for hyw-core, entari-plugin-hyw and hyw-cli"
authors = [{name = "kumoSleeping", email = "zjr2992@outlook.com"}]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "MIT"}

# Workspace root has no direct dependencies
dependencies = [
    "claude-agent-sdk>=0.1.26",
]

[project.optional-dependencies]
dev = [
    # Dev tools only - workspace packages are auto-resolved
    "entari-plugin-server>=0.5.0",
    "satori-python-adapter-onebot11>=0.2.5",
    "noneprompt",
    "rich",
    "pytest",
    "pytest-asyncio",
]

[tool.uv.workspace]
members = ["src/hyw_core", "src/entari_plugin_hyw", "src/hyw_cli"]

[tool.setuptools]
# Root package is not meant to be installed
py-modules = []
