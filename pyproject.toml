[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entari-plugin-hyw"
version = "6.0.0rc1"
description = "Entari plugin for HYW"
authors = [{name = "kumoSleeping", email = "zjr2992@outlook.com"}]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "arclet-entari[full]>=0.16.5",
    "httpx>=0.27.0",
    "DrissionPage>=4.0.0",
    "trafilatura>=1.6.0",
    "loguru>=0.7.0",
    "Pillow>=10.0.0",
    "markdown>=3.10",
    "satori-python-core<0.18.0",
    "satori-python-client<0.18.0",
]

[project.optional-dependencies]
dev = [
    "entari-plugin-server>=0.5.0",
    "entari-cli>=0.3.0",
    "satori-python-adapter-onebot11>=0.2.5",
    "noneprompt",
    "rich",
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
include-package-data = true
packages = ["entari_plugin_hyw", "entari_plugin_hyw.browser", "entari_plugin_hyw.crawling"]

[tool.setuptools.package-dir]
entari_plugin_hyw = "."

[tool.setuptools.package-data]
entari_plugin_hyw = [
    "browser/assets/**/*",
    "browser/card-ui/**/*",
]
