[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyw-workspace"
version = "0.0.1"
description = "HYW Workspace - Development environment for entari-plugin-hyw and entari-plugin-codex"
authors = [{name = "kumoSleeping", email = "zjr2992@outlook.com"}]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "MIT"}

# Workspace root has no direct dependencies
dependencies = ["arclet.entari[yaml,cron,dotenv] >= 0.16.8"]

[project.optional-dependencies]
dev = [
    # Workspace packages
    "entari-plugin-hyw",
    "entari-plugin-codex",
    # Dev tools
    "entari-plugin-server>=0.5.0",
    "entari-cli>=0.3.0",
    "satori-python-adapter-onebot11>=0.2.5",
    "noneprompt",
    "rich",
    "pytest",
    "pytest-asyncio",
]

[tool.uv.workspace]
members = ["src/entari_plugin_hyw", "src/entari_plugin_codex", "hyw-workspace/1528593481/work/entari_1"]

[tool.uv.sources]
entari-plugin-hyw = { workspace = true }
entari-plugin-codex = { workspace = true }

[tool.setuptools]
# Root package is not meant to be installed
py-modules = []
