name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'src/hyw_core/**'
      - 'src/entari_plugin_hyw/**'
      - 'src/hyw_cli/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (all, hyw-core, entari-plugin-hyw, hyw-cli)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - hyw-core
          - entari-plugin-hyw
          - hyw-cli

permissions:
  contents: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      hyw-core: ${{ steps.changes.outputs.hyw-core }}
      entari-plugin-hyw: ${{ steps.changes.outputs.entari-plugin-hyw }}
      hyw-cli: ${{ steps.changes.outputs.hyw-cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed packages
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.package }}" in
              all)
                echo "hyw-core=true" >> $GITHUB_OUTPUT
                echo "entari-plugin-hyw=true" >> $GITHUB_OUTPUT
                echo "hyw-cli=true" >> $GITHUB_OUTPUT
                ;;
              hyw-core)
                echo "hyw-core=true" >> $GITHUB_OUTPUT
                ;;
              entari-plugin-hyw)
                echo "entari-plugin-hyw=true" >> $GITHUB_OUTPUT
                ;;
              hyw-cli)
                echo "hyw-cli=true" >> $GITHUB_OUTPUT
                ;;
            esac
          else
            git diff --name-only HEAD~1 HEAD > changed_files.txt
            if grep -q "^src/hyw_core/" changed_files.txt; then
              echo "hyw-core=true" >> $GITHUB_OUTPUT
            fi
            if grep -q "^src/entari_plugin_hyw/" changed_files.txt; then
              echo "entari-plugin-hyw=true" >> $GITHUB_OUTPUT
            fi
            if grep -q "^src/hyw_cli/" changed_files.txt; then
              echo "hyw-cli=true" >> $GITHUB_OUTPUT
            fi
          fi

  publish-hyw-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.hyw-core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version
        id: get_version
        working-directory: src/hyw_core
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: src/hyw_core
        run: python -m build

      - name: Check distribution
        working-directory: src/hyw_core
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/hyw_core/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: hyw-core-v${{ env.VERSION }}
          name: hyw-core v${{ env.VERSION }}
          body: |
            Release hyw-core version ${{ env.VERSION }}
          files: |
            src/hyw_core/dist/*
          draft: false
          prerelease: false

  publish-entari-plugin-hyw:
    needs: [detect-changes, publish-hyw-core]
    if: always() && needs.detect-changes.outputs.entari-plugin-hyw == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version
        id: get_version
        working-directory: src/entari_plugin_hyw
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: src/entari_plugin_hyw
        run: python -m build

      - name: Check distribution
        working-directory: src/entari_plugin_hyw
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/entari_plugin_hyw/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: entari-plugin-hyw-v${{ env.VERSION }}
          name: entari-plugin-hyw v${{ env.VERSION }}
          body: |
            Release entari-plugin-hyw version ${{ env.VERSION }}
          files: |
            src/entari_plugin_hyw/dist/*
          draft: false
          prerelease: false

