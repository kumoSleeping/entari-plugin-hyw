name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'src/entari_plugin_hyw/**'
      - 'src/entari_plugin_codex/**'
      - 'src/hyw_cli/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (all, entari-plugin-hyw, entari-plugin-codex, hyw-cli)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - entari-plugin-hyw
          - entari-plugin-codex
          - hyw-cli

permissions:
  contents: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      entari-plugin-hyw: ${{ steps.changes.outputs.entari-plugin-hyw }}
      entari-plugin-codex: ${{ steps.changes.outputs.entari-plugin-codex }}
      hyw-cli: ${{ steps.changes.outputs.hyw-cli }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            entari-plugin-hyw: src/entari_plugin_hyw/**
            entari-plugin-codex: src/entari_plugin_codex/**
            hyw-cli: src/hyw_cli/**

      - name: Detect changed packages
        id: changes
        run: |
          # Initialize variables with filter outputs (empty if filter didn't run)
          ENTARI_PLUGIN="${{ steps.filter.outputs.entari-plugin-hyw }}"
          CODEX_PLUGIN="${{ steps.filter.outputs.entari-plugin-codex }}"
          HYW_CLI="${{ steps.filter.outputs.hyw-cli }}"

          # Handle manual dispatch overrides
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.package }}" in
              all)
                ENTARI_PLUGIN="true"
                CODEX_PLUGIN="true"
                HYW_CLI="true"
                ;;
              entari-plugin-hyw)
                ENTARI_PLUGIN="true"
                ;;
              entari-plugin-codex)
                CODEX_PLUGIN="true"
                ;;
              hyw-cli)
                HYW_CLI="true"
                ;;
            esac
          fi

          echo "Detected changes:"
          echo "entari-plugin-hyw: $ENTARI_PLUGIN"
          echo "entari-plugin-codex: $CODEX_PLUGIN"
          echo "hyw-cli: $HYW_CLI"

          echo "entari-plugin-hyw=$ENTARI_PLUGIN" >> $GITHUB_OUTPUT
          echo "entari-plugin-codex=$CODEX_PLUGIN" >> $GITHUB_OUTPUT
          echo "hyw-cli=$HYW_CLI" >> $GITHUB_OUTPUT

  publish-entari-plugin-hyw:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.entari-plugin-hyw == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version
        id: get_version
        working-directory: src/entari_plugin_hyw
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: src/entari_plugin_hyw
        run: python -m build

      - name: Check distribution
        working-directory: src/entari_plugin_hyw
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/entari_plugin_hyw/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: entari-plugin-hyw-v${{ env.VERSION }}
          name: entari-plugin-hyw v${{ env.VERSION }}
          body: |
            Release entari-plugin-hyw version ${{ env.VERSION }}
          files: |
            src/entari_plugin_hyw/dist/*
          draft: false
          prerelease: false

  publish-entari-plugin-codex:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.entari-plugin-codex == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Extract version
        id: get_version
        working-directory: src/entari_plugin_codex
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: src/entari_plugin_codex
        run: python -m build

      - name: Check distribution
        working-directory: src/entari_plugin_codex
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: src/entari_plugin_codex/dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: entari-plugin-codex-v${{ env.VERSION }}
          name: entari-plugin-codex v${{ env.VERSION }}
          body: |
            Release entari-plugin-codex version ${{ env.VERSION }}
          files: |
            src/entari_plugin_codex/dist/*
          draft: false
          prerelease: false

